name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I start the server on ..., it ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Windows
        - macOS
        - Linux
        - Web
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: v1.0.0 or commit sha
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `flutter doctor -v`, device/OS version, model used.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs, stack traces, or console output.
      render: shell
