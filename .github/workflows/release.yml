name: Release

# On pushing a version tag (e.g. v1.2.3) this builds artifacts for every
# platform and publishes a GitHub Release with auto-generated notes.
# Pre-releases: tag with a suffix, e.g. v1.2.3-beta.1.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: web
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux desktop build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev zip

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android (APK + AAB)
        if: matrix.target == 'android'
        shell: bash
        run: |
          V=${{ steps.version.outputs.version }}
          flutter build apk --release --build-name="$V" --build-number="${{ github.run_number }}"
          flutter build appbundle --release --build-name="$V" --build-number="${{ github.run_number }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/buildify-$V.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/buildify-$V.aab"

      - name: Build web
        if: matrix.target == 'web'
        shell: bash
        run: |
          V=${{ steps.version.outputs.version }}
          flutter build web --release --build-name="$V"
          mkdir -p dist
          tar -czf "dist/buildify-web-$V.tar.gz" -C build/web .

      - name: Build Linux
        if: matrix.target == 'linux'
        shell: bash
        run: |
          V=${{ steps.version.outputs.version }}
          flutter build linux --release --build-name="$V"
          mkdir -p dist
          tar -czf "dist/buildify-linux-x64-$V.tar.gz" -C build/linux/x64/release/bundle .

      - name: Build Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $V = "${{ steps.version.outputs.version }}"
          flutter build windows --release --build-name="$V"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/buildify-windows-x64-$V.zip"

      - name: Build macOS
        if: matrix.target == 'macos'
        shell: bash
        run: |
          V=${{ steps.version.outputs.version }}
          flutter build macos --release --build-name="$V"
          mkdir -p dist
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$APP" "dist/buildify-macos-$V.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
