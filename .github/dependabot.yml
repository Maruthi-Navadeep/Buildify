version: 2
updates:
  # Dart / Flutter packages
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 10
    labels: [dependencies, dart]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"

  # Android Gradle dependencies
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    labels: [dependencies, android]
    commit-message:
      prefix: "chore(deps)"
